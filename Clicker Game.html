<!DOCTYPE html>
<html>
<head>
<title>Clicker Game</title>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #ffffff;
        background: radial-gradient(circle at top, #3b5998 0%, #1d1f3e 45%, #0f1224 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .game-container {
        width: min(520px, 90%);
        padding: 24px;
        background: rgba(10, 14, 36, 0.85);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        text-align: center;
    }
    h1 {
        margin: 0 0 16px;
        font-size: 2rem;
        letter-spacing: 0.1em;
    }
    p {
        margin: 14px 0;
        font-size: 1rem;
    }
    button {
        margin: 10px 6px;
        padding: 12px 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #6c8cff, #3b55ff);
        color: white;
        cursor: pointer;
        font-size: 1rem;
    }
    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(35, 90, 255, 0.25);
    }
    #startScreen {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(7, 12, 30, 0.92);
        z-index: 10;
    }
    #startScreen .start-card {
        width: min(480px, 90%);
        padding: 30px;
        border-radius: 20px;
        background: rgba(20, 28, 64, 0.95);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
    }
    #startScreen h2 {
        margin-bottom: 14px;
        font-size: 2rem;
    }
    #startScreen p {
        margin-bottom: 24px;
        color: #cfd8ff;
    }
</style>
</head>
<body>
<div id="startScreen">
    <div class="start-card">
        <h2>Welcome to Clicker Game</h2>
        <p>Tap the button to collect points, buy upgrades, and unlock auto-clickers. Ready to start?</p>
        <button id="startBtn">Start Game</button>
    </div>
</div>
<div class="game-container" id="gameUI" style="display:none;">
    <h1>Clicker Game</h1>
    <p>Points: <span id="points">0</span></p>
    <p>Points per click: <span id="ppc">1</span></p>
    <p>Combo level: <span id="comboLevel">1</span> &middot; Multiplier: <span id="comboMult">1.0</span>x</p>
    <p>Current streak: <span id="comboStreak">0</span></p>
    <p>Auto points per second: <span id="apps">0</span></p>
    <button id="clickBtn">Click for points</button>
    <button id="upgradeBtn">Buy Upgrade (Cost: <span id="upgradeCost">10</span>)</button>
    <button id="comboBtn">Upgrade Combo (Cost: <span id="comboCost">30</span>)</button>
    <button id="autoBtn">Buy Auto-Clicker (Cost: <span id="autoCost">50</span>)</button>
</div>
<script>
let points = 0;
let pointsPerClick = 1;
let autoPointsPerSecond = 0;
let upgradeCost = 10;
let autoCost = 50;
let comboLevel = 1;
let comboCost = 30;
let comboStreak = 0;
let comboMultiplier = 1;
let lastClickTime = 0;

function playClickSound() {}
function playUpgradeSound() {}
function playComboSound() {}

function updateDisplay() {
    document.getElementById('points').innerText = points;
    document.getElementById('ppc').innerText = pointsPerClick;
    document.getElementById('apps').innerText = autoPointsPerSecond;
    document.getElementById('upgradeCost').innerText = upgradeCost;
    document.getElementById('autoCost').innerText = autoCost;
    document.getElementById('comboLevel').innerText = comboLevel;
    document.getElementById('comboCost').innerText = comboCost;
    document.getElementById('comboStreak').innerText = comboStreak;
    document.getElementById('comboMult').innerText = comboMultiplier.toFixed(1);
}

function calculateComboMultiplier() {
    const streakBonus = Math.min(comboStreak, 20) * 0.05;
    const levelBonus = (comboLevel - 1) * 0.2;
    return 1 + streakBonus + levelBonus;
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameUI').style.display = 'block';
}

// Load from localStorage
if (localStorage.getItem('points')) {
    points = parseInt(localStorage.getItem('points'));
    pointsPerClick = parseInt(localStorage.getItem('pointsPerClick')) || 1;
    autoPointsPerSecond = parseInt(localStorage.getItem('autoPointsPerSecond')) || 0;
    upgradeCost = parseInt(localStorage.getItem('upgradeCost')) || 10;
    autoCost = parseInt(localStorage.getItem('autoCost')) || 50;
    comboLevel = parseInt(localStorage.getItem('comboLevel')) || 1;
    comboCost = parseInt(localStorage.getItem('comboCost')) || 30;
    comboStreak = parseInt(localStorage.getItem('comboStreak')) || 0;
}

function resetCombo() {
    comboStreak = 0;
    comboMultiplier = calculateComboMultiplier();
}

function handleClick() {
    const now = Date.now();
    if (now - lastClickTime <= 1200) {
        comboStreak += 1;
    } else {
        comboStreak = 1;
    }
    lastClickTime = now;
    comboMultiplier = calculateComboMultiplier();
    const earned = Math.floor(pointsPerClick * comboMultiplier);
    points += earned;
    playClickSound();
    if (comboStreak > 1) {
        playComboSound();
    }
    updateDisplay();
}

document.getElementById('startBtn').addEventListener('click', startGame);

document.getElementById('clickBtn').addEventListener('click', handleClick);

document.getElementById('upgradeBtn').addEventListener('click', () => {
    if (points >= upgradeCost) {
        points -= upgradeCost;
        pointsPerClick += 1;
        upgradeCost = Math.floor(upgradeCost * 1.5);
        playUpgradeSound();
        updateDisplay();
    }
});

document.getElementById('comboBtn').addEventListener('click', () => {
    if (points >= comboCost) {
        points -= comboCost;
        comboLevel += 1;
        comboCost = Math.floor(comboCost * 2.2);
        comboMultiplier = calculateComboMultiplier();
        playUpgradeSound();
        updateDisplay();
    }
});

document.getElementById('autoBtn').addEventListener('click', () => {
    if (points >= autoCost) {
        points -= autoCost;
        autoPointsPerSecond += 1;
        autoCost = Math.floor(autoCost * 1.5);
        playUpgradeSound();
        updateDisplay();
    }
});

setInterval(() => {
    points += autoPointsPerSecond;
    updateDisplay();
}, 1000);

setInterval(() => {
    localStorage.setItem('points', points);
    localStorage.setItem('pointsPerClick', pointsPerClick);
    localStorage.setItem('autoPointsPerSecond', autoPointsPerSecond);
    localStorage.setItem('upgradeCost', upgradeCost);
    localStorage.setItem('autoCost', autoCost);
    localStorage.setItem('comboLevel', comboLevel);
    localStorage.setItem('comboCost', comboCost);
    localStorage.setItem('comboStreak', comboStreak);
}, 5000);

updateDisplay();
</script>
</body>
</html>
